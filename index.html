<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Diario de Viajes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Mi Diario de Viajes</h1>

        <!-- Cuaderno 3D -->
        <div class="notebook-3d">
            <!-- Portada frontal -->
            <div class="book-cover front-cover">
                <div class="cover-content">
                    <div class="cover-title" id="coverTitle" contenteditable="true">Mi Diario de Viajes</div>
                    <div class="cover-subtitle" id="coverSubtitle" contenteditable="true">Memorias y Aventuras</div>
                    <div class="cover-decoration"></div>
                    <button class="customize-cover-btn" id="customizeCoverBtn">🎨 Personalizar Portada</button>
                </div>
            </div>

            <!-- Contraportada -->
            <div class="book-cover back-cover"></div>

            <!-- Lomo del libro -->
            <div class="book-spine">
                <div class="spine-text">MI DIARIO DE VIAJES</div>
            </div>

            <!-- Páginas internas -->
            <div class="pages-container">
                <!-- Página izquierda -->
                <div class="page left-page">
                    <div class="page-content" id="leftPageContent">
                        <h2>Bienvenido</h2>
                        <p>Comienza tu aventura</p>
                    </div>
                </div>

                <!-- Página derecha (la que se voltea) -->
                <div class="page right-page" id="currentPage">
                    <div class="page-front">
                        <div class="page-content" id="frontPageContent">
                            <!-- Contenido dinámico -->
                        </div>
                    </div>
                    <div class="page-back">
                        <div class="page-content" id="backPageContent">
                            <!-- Contenido dinámico -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Icono de brocha para modo edición (flotante) -->
        <div class="edit-mode-toggle" id="editModeToggle" title="Activar modo edición">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20.71 4.63l-1.34-1.34c-.39-.39-1.02-.39-1.41 0L9 12.25 11.75 15l8.96-8.96c.39-.39.39-1.02 0-1.41z"/>
                <path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4l-3-3z"/>
            </svg>
        </div>

        <!-- Flechas de navegación para modo visualización -->
        <div class="nav-arrows" id="navArrows">
            <button class="arrow-btn left-arrow" id="leftArrow" title="Página anterior">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                </svg>
            </button>
            <button class="arrow-btn right-arrow" id="rightArrow" title="Página siguiente">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                </svg>
            </button>
        </div>

        <!-- Menú lateral para modo edición -->
        <div class="sidebar-menu edit-mode-controls" id="sidebarMenu" style="display: none;">
            <h3 class="sidebar-title">Elementos</h3>

            <div class="element-category">
                <h4>Contenido</h4>
                <div class="element-item" draggable="true" data-element-type="title">
                    <span class="element-icon">📝</span>
                    <span class="element-name">Título</span>
                </div>
                <div class="element-item" draggable="true" data-element-type="text">
                    <span class="element-icon">📄</span>
                    <span class="element-name">Texto</span>
                </div>
                <div class="element-item" draggable="true" data-element-type="image">
                    <span class="element-icon">🖼️</span>
                    <span class="element-name">Imagen</span>
                </div>
            </div>

            <div class="element-category">
                <h4>Decoración</h4>
                <div class="element-item" draggable="true" data-element-type="icon">
                    <span class="element-icon">⭐</span>
                    <span class="element-name">Icono/Emoji</span>
                </div>
                <div class="element-item" draggable="true" data-element-type="sticker">
                    <span class="element-icon">🎨</span>
                    <span class="element-name">Sticker</span>
                </div>
            </div>

            <div class="sidebar-actions">
                <button class="sidebar-btn" id="addPageBtn">+ Agregar Página</button>
                <button class="sidebar-btn secondary" id="viewIndexBtn">📑 Ver Índice</button>
            </div>
        </div>

        <!-- Controles de navegación (Modo Edición) -->
        <div class="controls edit-mode-controls" style="display: none;">
            <button class="nav-btn" id="prevBtn" disabled>← Anterior</button>
            <span class="page-counter" id="pageCounter">Portada</span>
            <button class="nav-btn" id="nextBtn">Siguiente →</button>
        </div>
    </div>

    <!-- Modal para personalizar portada -->
    <div class="modal" id="coverModal">
        <div class="modal-content">
            <span class="close-modal" id="closeCoverModal">&times;</span>
            <h2>Personalizar Portada</h2>

            <div class="customization-section">
                <label>Color de fondo:</label>
                <div class="color-options">
                    <button class="color-btn" data-color="#8b4513" style="background: #8b4513;"></button>
                    <button class="color-btn" data-color="#2c3e50" style="background: #2c3e50;"></button>
                    <button class="color-btn" data-color="#34495e" style="background: #34495e;"></button>
                    <button class="color-btn" data-color="#8e44ad" style="background: #8e44ad;"></button>
                    <button class="color-btn" data-color="#16a085" style="background: #16a085;"></button>
                    <button class="color-btn" data-color="#c0392b" style="background: #c0392b;"></button>
                </div>
            </div>

            <div class="customization-section">
                <label>Textura:</label>
                <div class="texture-options">
                    <button class="texture-btn" data-texture="leather">Cuero</button>
                    <button class="texture-btn" data-texture="fabric">Tela</button>
                    <button class="texture-btn" data-texture="paper">Papel</button>
                    <button class="texture-btn" data-texture="smooth">Liso</button>
                </div>
            </div>

            <div class="customization-section">
                <label>Imagen de portada:</label>
                <input type="file" id="coverImageInput" accept="image/*">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
